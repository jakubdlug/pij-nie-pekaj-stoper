<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pij, nie pękaj!</title>
<style>
  :root {
    --red: #e8314a;
    --teal: #3ec9d6;
    --cream: #fdf6ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--red);
    background-image: radial-gradient(rgba(0,0,0,0.15) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--cream);
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
  }
  .title {
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -1px;
    margin: 0;
  }
  .title .pij {
    display: block;
    font-size: clamp(56px, 16vw, 110px);
    color: var(--teal);
    -webkit-text-stroke: 3px #0d2b2f;
    text-shadow: 4px 4px 0 #0d2b2f;
  }
  .title .niepekaj {
    display: block;
    font-size: clamp(34px, 9vw, 64px);
    color: var(--cream);
    -webkit-text-stroke: 2px #4a0010;
    text-shadow: 3px 3px 0 #4a0010;
    margin-top: 6px;
  }
  .bomb {
    font-size: 54px;
    margin: 18px 0;
  }
  .badge {
    display: inline-block;
    background: var(--cream);
    color: var(--red);
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    margin-top: 28px;
    font-size: 15px;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .sub {
    margin-top: 18px;
    font-size: 16px;
    opacity: 0.9;
    max-width: 420px;
  }
  footer {
    margin-top: 48px;
    font-size: 13px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">
      <span class="pij">PIJ</span>
      <span class="niepekaj">NIE PĘKAJ!</span>
    </h1>
    <div class="bomb" aria-hidden="true">💣</div>
    <div class="badge">Cyfrowy stoper — wkrótce</div>
    <p class="sub">Ta strona dopiero się rozkręca. Niedługo znajdziesz tu stoper do gry — na razie zeskanowałeś kod za wcześnie, wróć za chwilę.</p>
    <footer>Eventom Sp. z o.o. · gra imprezowa 18+</footer>
  </div>
</body>
</html>
