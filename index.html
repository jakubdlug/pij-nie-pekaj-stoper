<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pij, nie pękaj! — stoper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8314a;
    --red-deep: #b5172f;
    --teal: #3ec9d6;
    --teal-deep: #1f6b73;
    --cream: #fdf6ea;
    --ink: #0d2b2f;
    --display-font: 'Luckiest Guy', cursive;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--cream);
  }
  body {
    background: var(--red);
    background-image: radial-gradient(rgba(0,0,0,0.15) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px 20px;
  }
  .screen.active { display: flex; }

  /* ---------- SETUP ---------- */
  .title {
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -1px;
    margin: 0 0 6px;
    align-self: stretch;
  }
  .logo-img {
    display: block;
    width: 100%;
    max-width: 340px;
    height: auto;
    margin: 0 auto;
  }
  .bomb-static { margin: 10px 0; }
  .bomb-static .bomb-svg { width: 52px; height: auto; display: block; }
  .running-bomb .bomb-svg { width: 84px; height: auto; display: block; }

  .players-box {
    background: rgba(13,43,47,0.25);
    border: 2px solid rgba(253,246,234,0.5);
    border-radius: 20px;
    padding: 18px 22px;
    margin: 18px 0 8px;
    width: 100%;
    max-width: 320px;
  }
  .players-label {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 10px;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .stepper button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--cream);
    color: var(--red-deep);
    font-size: 28px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .stepper button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .stepper button:disabled { opacity: 0.35; box-shadow: none; }
  .players-count {
    font-size: 44px;
    font-family: var(--display-font);
    font-weight: 400;
    min-width: 64px;
    color: var(--cream);
  }
  .round-time {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
  }
  .round-time b { color: var(--teal); font-size: 18px; font-family: var(--display-font); font-weight: 400; }

  .btn {
    border: none;
    border-radius: 999px;
    font-weight: 400;
    cursor: pointer;
    font-family: var(--display-font);
    letter-spacing: 0.5px;
  }
  .btn-primary {
    background: var(--teal);
    color: var(--ink);
    font-size: 20px;
    padding: 18px 48px;
    margin-top: 18px;
    box-shadow: 0 4px 0 var(--teal-deep);
  }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--teal-deep); }
  .btn-ghost {
    background: transparent;
    color: var(--cream);
    border: 2px solid rgba(253,246,234,0.6);
    font-size: 14px;
    padding: 10px 20px;
    margin-top: 14px;
    opacity: 0.9;
  }
  .btn-ghost:active { opacity: 0.6; }

  footer.credit {
    position: absolute;
    bottom: 14px;
    font-size: 12px;
    opacity: 0.55;
  }

  /* ---------- RUNNING ---------- */
  #running {
    background: var(--teal);
    transition: background-color 0.4s linear;
  }
  .running-bomb {
    font-size: 70px;
    will-change: transform;
  }
  .running-msg {
    font-size: 22px;
    font-weight: 800;
    margin-top: 18px;
    max-width: 320px;
  }
  .running-hint {
    font-size: 14px;
    opacity: 0.85;
    margin-top: 14px;
    max-width: 300px;
  }
  .cancel-link {
    position: absolute;
    top: 18px;
    right: 18px;
    background: transparent;
    border: none;
    color: var(--cream);
    opacity: 0.6;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---------- ALARM ---------- */
  #alarm {
    background: var(--red-deep);
    animation: flash 0.5s step-start infinite;
  }
  @keyframes flash {
    0%, 49% { background-color: var(--red-deep); }
    50%, 100% { background-color: var(--red); }
  }
  .explosion {
    font-size: 90px;
    animation: pop 0.6s ease-out 1;
  }
  @keyframes pop {
    0% { transform: scale(0.4) rotate(-8deg); opacity: 0.3; }
    60% { transform: scale(1.3) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .alarm-title {
    font-family: var(--display-font);
    font-weight: 400;
    font-size: clamp(36px, 10vw, 60px);
    margin-top: 8px;
    letter-spacing: 1px;
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 3px 3px 0 var(--ink);
  }
  .alarm-sub {
    font-size: 16px;
    margin-top: 8px;
    opacity: 0.95;
  }
</style>
</head>

    <button class="btn btn-primary" id="startBtn">START RUNDY</button>

  <section id="running" class="screen">
    <button class="cancel-link" id="cancelBtn">Anuluj rundę</button>
    <div class="running-bomb" id="runningBomb" aria-hidden="true"><svg class="bomb-svg" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="100" rx="24" ry="5" fill="#000" opacity="0.22"/><circle cx="50" cy="70" r="32" fill="#17171c" stroke="#0a0a0d" stroke-width="4"/><path d="M26 58 A 28 28 0 0 1 40 40" fill="none" stroke="#f2efe8" stroke-width="6" stroke-linecap="round" opacity="0.45"/><rect x="42" y="30" width="16" height="12" rx="3" fill="#d8d3c8" stroke="#0a0a0d" stroke-width="3"/><path d="M52 34 C60 28 42 24 52 18 C58 14 48 10 54 4" fill="none" stroke="#f2c230" stroke-width="5" stroke-linecap="round"/><path d="M64 2 L68 10 L77 12 L68 15 L64 24 L60 15 L51 12 L60 10 Z" fill="#ffcf3f" stroke="#0a0a0d" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
    <div class="running-msg">Trwa runda — podawajcie kartę!</div>
    <div class="running-hint">Czas jest ukryty. Nie blokujcie ekranu telefonu, żeby alarm na pewno zadziałał.</div>
  </section>

  <section id="alarm" class="screen">
    <div class="explosion" id="explosionEmoji" aria-hidden="true">💥</div>
    <div class="alarm-title">KTOŚ PĘKŁ!</div>
    <div class="alarm-sub">Ta osoba pije i zatrzymuje kartę.</div>

  <audio id="silentLoop" loop playsinline style="display:none" src="data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAPAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA"></audio>

<script>
(function () {
  "use strict";

  var MIN_PLAYERS = 2, MAX_PLAYERS = 15, SECONDS_PER_PLAYER = 15;
  var players = 6;

  var screens = {
    setup: document.getElementById('setup'),
    running: document.getElementById('running'),
    alarm: document.getElementById('alarm')
  };
  function showScreen(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle('active', k === name);
    });
  }

  var playersCountEl = document.getElementById('playersCount');
  var roundTimeEl = document.getElementById('roundTime');
  var minusBtn = document.getElementById('minus');
  var plusBtn = document.getElementById('plus');

  function renderPlayers() {
    playersCountEl.textContent = players;
    roundTimeEl.textContent = (players * SECONDS_PER_PLAYER) + ' s';
    minusBtn.disabled = players <= MIN_PLAYERS;
    plusBtn.disabled = players >= MAX_PLAYERS;
  }
  minusBtn.addEventListener('click', function () {
    if (players > MIN_PLAYERS) { players--; renderPlayers(); }
  });
  plusBtn.addEventListener('click', function () {
    if (players < MAX_PLAYERS) { players++; renderPlayers(); }
  });
  renderPlayers();

  /* ---------------- Audio (Web Audio API, no files) ---------------- */
  var audioCtx = null;
  var silentLoop = document.getElementById('silentLoop');
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    /* iOS Safari mutes AudioContext sound when the hardware ring/silent switch is
       set to silent, unless a native <audio>/<video> element is also playing -
       keeping this silent loop running forces the "playback" audio category. */
    if (silentLoop && silentLoop.paused) {
      silentLoop.play().catch(function () { /* ignored until next gesture */ });
    }
    return audioCtx;
  }

  function playTick() {
    var ctx = ensureAudio();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 920;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.09);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  }

  function makeNoiseBuffer(ctx, dur) {
    var bufferSize = Math.floor(ctx.sampleRate * dur);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function playExplosion(ctx, at) {
    var tailDur = 1.7;

    /* crack: short bright transient so the hit feels sharp, not mushy */
    var crack = ctx.createBufferSource();
    crack.buffer = makeNoiseBuffer(ctx, 0.08);
    var crackFilter = ctx.createBiquadFilter();
    crackFilter.type = 'highpass';
    crackFilter.frequency.value = 900;
    var crackGain = ctx.createGain();
    crackGain.gain.setValueAtTime(0.9, at);
    crackGain.gain.exponentialRampToValueAtTime(0.0001, at + 0.07);
    crack.connect(crackFilter).connect(crackGain).connect(ctx.destination);
    crack.start(at);
    crack.stop(at + 0.09);

    /* rumble: the big low body of the blast, filter closing down as it dissipates */
    var rumble = ctx.createBufferSource();
    rumble.buffer = makeNoiseBuffer(ctx, tailDur);
    var rumbleFilter = ctx.createBiquadFilter();
    rumbleFilter.type = 'lowpass';
    rumbleFilter.frequency.setValueAtTime(2200, at);
    rumbleFilter.frequency.exponentialRampToValueAtTime(60, at + tailDur);
    var rumbleGain = ctx.createGain();
    rumbleGain.gain.setValueAtTime(0.0001, at);
    rumbleGain.gain.linearRampToValueAtTime(0.85, at + 0.02);
    rumbleGain.gain.exponentialRampToValueAtTime(0.0001, at + tailDur);
    rumble.connect(rumbleFilter).connect(rumbleGain).connect(ctx.destination);
    rumble.start(at);
    rumble.stop(at + tailDur + 0.02);

    /* sub thump: the chest-punch low end */
    [62, 44, 30].forEach(function (freq, idx) {
      var sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(freq, at);
      sub.frequency.exponentialRampToValueAtTime(freq * 0.4, at + 0.6);
      var subGain = ctx.createGain();
      subGain.gain.setValueAtTime(0.0001, at);
      subGain.gain.linearRampToValueAtTime(0.8 - idx * 0.15, at + 0.015);
      subGain.gain.exponentialRampToValueAtTime(0.0001, at + 0.9);
      sub.connect(subGain).connect(ctx.destination);
      sub.start(at);
      sub.stop(at + 0.95);
    });

    /* debris crackle: a handful of random pops scattered over the tail */
    var debrisCount = 10;
    for (var d = 0; d < debrisCount; d++) {
      var dAt = at + 0.12 + Math.random() * (tailDur - 0.2);
      var pop = ctx.createBufferSource();
      pop.buffer = makeNoiseBuffer(ctx, 0.02);
      var popFilter = ctx.createBiquadFilter();
      popFilter.type = 'bandpass';
      popFilter.frequency.value = 600 + Math.random() * 2000;
      popFilter.Q.value = 2;
      var popGain = ctx.createGain();
      var popLevel = 0.12 * (1 - (dAt - at) / tailDur) + 0.02;
      popGain.gain.setValueAtTime(popLevel, dAt);
      popGain.gain.exponentialRampToValueAtTime(0.0001, dAt + 0.03);
      pop.connect(popFilter).connect(popGain).connect(ctx.destination);
      pop.start(dAt);
      pop.stop(dAt + 0.04);
    }
  }

  function playAlarm() {
    var ctx = ensureAudio();
    if (!ctx) return;
    playExplosion(ctx, ctx.currentTime);
  }

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }

  document.getElementById('testSoundBtn').addEventListener('click', function () {
    ensureAudio();
    playAlarm();
    vibrate([120]);
  });

  /* ---------------- Wake Lock ---------------- */
  var wakeLock = null;
  function requestWakeLock() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { /* not available / denied - hint text covers this */ });
    }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state === 'running' && !wakeLock) {
      requestWakeLock();
    }
  });

  /* ---------------- Round engine ---------------- */
  var state = 'setup';
  var rafId = null, tickTimeoutId = null;
  var startTime = 0, totalMs = 0;
  var runningBomb = document.getElementById('runningBomb');
  var runningScreenEl = screens.running;

  function lerp(a, b, f) { return a + (b - a) * f; }

  function loopFrame() {
    var elapsed = performance.now() - startTime;
    var fraction = Math.min(1, elapsed / totalMs);

    var r = Math.round(lerp(62, 232, fraction));
    var g = Math.round(lerp(201, 49, fraction));
    var b = Math.round(lerp(214, 74, fraction));
    runningScreenEl.style.backgroundColor = 'rgb(' + r + ',' + g + ',' + b + ')';

    var freq = lerp(0.6, 3.2, fraction);
    var scale = 1 + Math.sin(elapsed / 1000 * freq * Math.PI * 2) * lerp(0.05, 0.16, fraction);
    runningBomb.style.transform = 'scale(' + scale.toFixed(3) + ')';

    if (fraction >= 1) {
      triggerAlarm();
      return;
    }
    rafId = requestAnimationFrame(loopFrame);
  }

  function scheduleTick() {
    var elapsed = performance.now() - startTime;
    var fraction = Math.min(1, elapsed / totalMs);
    if (fraction >= 1 || state !== 'running') return;
    playTick();
    var remainingFraction = 1 - fraction;
    var delay = lerp(250, 1700, remainingFraction);
    tickTimeoutId = setTimeout(scheduleTick, delay);
  }

  function startRound() {
    ensureAudio();
    totalMs = players * SECONDS_PER_PLAYER * 1000;
    startTime = performance.now();
    state = 'running';
    showScreen('running');
    requestWakeLock();
    rafId = requestAnimationFrame(loopFrame);
    tickTimeoutId = setTimeout(scheduleTick, 1200);
  }

  function stopTimers() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (tickTimeoutId) { clearTimeout(tickTimeoutId); tickTimeoutId = null; }
  }

  function triggerAlarm() {
    stopTimers();
    state = 'alarm';
    releaseWakeLock();
    showScreen('alarm');
    playAlarm();
    vibrate([200, 100, 200, 100, 200, 100, 600]);
  }

  function cancelRound() {
    stopTimers();
    releaseWakeLock();
    state = 'setup';
    showScreen('setup');
  }

  document.getElementById('startBtn').addEventListener('click', startRound);
  document.getElementById('cancelBtn').addEventListener('click', cancelRound);
  document.getElementById('nextRoundBtn').addEventListener('click', startRound);
  document.getElementById('changePlayersBtn').addEventListener('click', function () {
    state = 'setup';
    showScreen('setup');
  });
})();
</script>
